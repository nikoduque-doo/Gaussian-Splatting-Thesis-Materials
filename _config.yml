# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-include-cache

# The language of the webpage
lang: en

# Change to your timezone
timezone: America/New_York # Update this if needed (e.g., Europe/London)

# jekyll-seo-tag settings
# ↓ --------------------------

title: Gaussian Splatting Thesis # Your actual title
tagline: Research & Documentation # Your subtitle
description: >-
  Thesis materials and research documentation on Gaussian Splatting.

# The site domain (Must be the root domain)
url: "https://nikoduque-doo.github.io"

# The project path (Must start with / and have NO trailing slash)
baseurl: "/Gaussian-Splatting-Thesis-Materials"

# Chirpy needs this to know it's on GitHub
repository: nikoduque-doo/Gaussian-Splatting-Thesis-Materials

github:
  username: nikoduque-doo

twitter:
  username: # Add if you have one

social:
  name: Niko Duque # Update with your real name
  email: # Add email if you want
  links:
    - https://github.com/nikoduque-doo

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings (Optional - leave empty if unused)
analytics:
  google:
    id:

# Page views settings
pageviews:
  provider:

# Color scheme (Auto follows system preference by default)
theme_mode:

# The CDN endpoint for media resources.
# CRITICAL FIX: Left empty so it uses your local assets folder.
# If this points to cdn.com or netlify, your site will look broken.
cdn: ""

# The avatar on sidebar (Put an image named avatar.jpg in assets/img/ or change this path)
avatar: "/assets/img/avatar.jpg" 

# TOC settings
toc: true

comments:
  provider:

# Self-hosted static assets
assets:
  self_host:
    enabled:

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
